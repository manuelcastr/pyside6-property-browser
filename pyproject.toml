[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtpropertybrowser"
version = "0.1.0"
description = "Qt Property Browser refactored for PySide6"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false